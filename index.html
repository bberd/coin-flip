<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call It — Shared Coin Flip</title>
<meta name="description" content="Two people, two computers, one coin flip. Peer-to-peer, no backend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<style>
  :root {
    --ink:       #0f1420;
    --ink-2:     #161d2c;
    --brass-hi:  #f3dca4;
    --brass:     #c9a24d;
    --brass-deep:#7a5d24;
    --patina:    #5fa892;
    --chalk:     #ece8dd;
    --chalk-dim: #8b8877;
    --rule:      rgba(201,162,77,.20);
    --seam:      rgba(201,162,77,.30);
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --display: 'Cinzel', 'Trajan Pro', 'Times New Roman', Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; background: var(--ink); }

  body {
    background:
      radial-gradient(120% 78% at 50% -12%, #1c2538 0%, #131a29 46%, #0b0f18 100%);
    color: var(--chalk);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: clamp(26px, 7vw, 54px) 20px 52px;
  }

  .panel { width: 100%; max-width: 470px; }

  /* ---------- masthead ---------- */

  .eyebrow {
    font-size: 9.5px;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    text-align: center;
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(42px, 13vw, 60px);
    line-height: 1;
    letter-spacing: .17em;
    word-spacing: .14em;
    text-transform: uppercase;
    text-align: center;
    margin: 12px 0 0;
    text-indent: .17em;
    color: var(--brass-hi);
    text-shadow: 0 2px 0 rgba(0,0,0,.45);
  }

  .rule { display: flex; align-items: center; gap: 11px; margin: 16px 0 12px; }
  .rule::before, .rule::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--rule), transparent);
  }
  .rule i { width: 5px; height: 5px; background: var(--brass); opacity: .65; transform: rotate(45deg); }

  .status {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--chalk-dim); min-height: 16px;
  }
  .status::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--chalk-dim); opacity: .5; transition: background .3s, opacity .3s;
  }
  body.is-live .status::before { background: var(--patina); opacity: 1; box-shadow: 0 0 8px var(--patina); }

  /* ---------- invite plate ---------- */

  .invite-box {
    margin-top: 22px;
    border: 1px solid var(--rule);
    background: rgba(255,255,255,.022);
    padding: 13px 14px 14px;
  }
  .invite-box p {
    margin: 0 0 9px;
    font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--chalk-dim);
  }
  .invite-row { display: flex; gap: 8px; }
  .invite-row input {
    flex: 1; min-width: 0;
    background: rgba(0,0,0,.3);
    border: 1px solid var(--rule);
    color: var(--brass-hi);
    font-family: var(--mono); font-size: 11px;
    padding: 9px 10px;
  }
  .copy-btn {
    font-family: var(--mono); font-size: 9.5px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase;
    background: transparent; border: 1px solid var(--brass-deep);
    color: var(--brass-hi); padding: 0 15px; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .copy-btn:hover { background: var(--brass-hi); color: #241a06; }

  /* ---------- the field: two territories split by an engraved seam ---------- */

  .field { position: relative; margin-top: 26px; }
  .field::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 42px;
    width: 1px; margin-left: -.5px; pointer-events: none;
    background: linear-gradient(180deg, transparent, var(--seam) 10%, var(--seam) 86%, transparent);
  }

  .table {
    display: grid; grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  .territory { position: relative; padding: 15px 17px 17px; transition: background .5s ease; }
  .territory::after {
    content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px;
    background: var(--patina); opacity: 0; transition: opacity .45s;
  }
  .territory.is-winner::after { opacity: 1; }
  .territory--mine   { padding-left: 0; }
  .territory--theirs { padding-right: 0; text-align: right; }

  .territory.is-winner { background: linear-gradient(180deg, rgba(95,168,146,.16), transparent 72%); }
  .territory.is-winner .territory__role { color: var(--patina); }

  .territory__role {
    font-size: 9px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--chalk-dim); margin-bottom: 9px; transition: color .4s;
  }

  .territory input {
    width: 100%;
    background: transparent; border: 0; border-bottom: 1px solid var(--rule);
    color: var(--chalk); font-family: var(--mono); font-size: 14px;
    padding: 4px 0 7px; margin-bottom: 12px;
  }
  .territory input::placeholder { color: rgba(139,136,119,.6); }
  .territory input:focus { outline: 0; border-bottom-color: var(--brass); }

  .opponent-name {
    font-size: 14px; color: var(--chalk); padding: 4px 0 7px;
    border-bottom: 1px solid var(--rule); margin-bottom: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .opponent-name.is-empty { color: rgba(139,136,119,.7); }

  .side-buttons { display: flex; gap: 6px; }
  .side-btn {
    flex: 1; cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; font-weight: 500;
    letter-spacing: .2em; text-transform: uppercase;
    padding: 9px 0;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--rule);
    color: var(--chalk-dim);
    transition: background .25s, color .25s, border-color .25s, opacity .35s;
  }
  .side-btn:hover:not(:disabled) { border-color: var(--brass-deep); color: var(--brass-hi); }
  .side-btn.chosen {
    background: linear-gradient(180deg, var(--brass-hi), var(--brass));
    border-color: var(--brass-deep);
    color: #2a1f0a; font-weight: 600;
  }
  .side-btn:disabled { cursor: default; opacity: .34; }
  .side-btn.chosen:disabled { opacity: .5; }

  .side-readout {
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--brass-hi); min-height: 15px;
  }

  /* ---------- arena ---------- */

  .arena { position: relative; display: grid; place-items: center; padding: 34px 0 8px; }

  .rosette {
    position: absolute; width: 310px; height: 310px; pointer-events: none;
    opacity: .3; color: var(--brass);
  }
  .rosette path { fill: none; stroke: currentColor; vector-effect: non-scaling-stroke; }
  .rosette .g1 { stroke-width: .4; opacity: .85; }
  .rosette .g2 { stroke-width: .3; opacity: .5; }
  body.is-flipping .rosette { animation: rosette-turn 1.1s cubic-bezier(.4,0,.2,1); }
  @keyframes rosette-turn { from { transform: rotate(0); } to { transform: rotate(120deg); } }

  .coin-stage { width: 186px; height: 186px; perspective: 1100px; position: relative; z-index: 1; }

  .coin {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.34, 1.1, .3, 1);
  }
  .coin.spinning { animation: spin-coin 1.1s cubic-bezier(.4, 0, .2, 1); }
  .coin.previewing { transition: transform .55s cubic-bezier(.4, 0, .2, 1); }
  @keyframes spin-coin {
    0%   { transform: rotateY(0deg) translateY(0); }
    50%  { transform: rotateY(900deg) translateY(-40px); }
    100% { transform: rotateY(1800deg) translateY(0); }
  }

  .coin__face {
    position: absolute; inset: 0; border-radius: 50%;
    backface-visibility: hidden;
    box-shadow: 0 16px 34px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.45);
  }
  .coin__face svg { width: 100%; height: 100%; display: block; border-radius: 50%; }
  .coin-name, .coin-motto {
    font-family: var(--display);
    font-weight: 600;
    text-transform: uppercase;
  }
  .coin__face--back { transform: rotateY(180deg); }

  .cast-shadow {
    position: absolute; bottom: 2px; width: 128px; height: 15px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.6), transparent 68%);
    filter: blur(3px);
  }

  /* ---------- verdict ---------- */

  .result {
    font-family: var(--display); font-size: 21px; line-height: 1.35;
    text-align: center; color: var(--chalk);
    min-height: 30px; margin: 22px 0 20px;
  }
  .result span { color: var(--brass-hi); }
  .result.muted { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--chalk-dim); }

  .flip-row { display: flex; justify-content: center; }

  .flip-btn {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: .3em; text-transform: uppercase;
    padding: 15px 42px; cursor: pointer;
    color: #2a1f0a;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass) 58%, #ab8339);
    border: 1px solid var(--brass-deep);
    box-shadow: 0 7px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.55);
    transition: transform .12s, box-shadow .2s, filter .3s, opacity .3s;
  }
  .flip-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.6); }
  .flip-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 3px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.4); }
  .flip-btn:disabled { cursor: default; filter: grayscale(.85); opacity: .3; }

  :focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }

  /* ---------- ledger ---------- */

  .ledger {
    margin-top: 30px; padding-top: 16px;
    border-top: 1px solid var(--rule);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .ledger[hidden] { display: none; }
  .score {
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--chalk-dim);
    text-align: center;
  }
  .score strong { color: var(--brass-hi); font-weight: 600; }

  .history-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chip {
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 9px; font-weight: 600; letter-spacing: .04em;
    border: 1px solid var(--brass-deep);
    background: linear-gradient(180deg, var(--brass-hi), var(--brass));
    color: #2a1f0a;
  }
  .chip--tails { background: transparent; border-color: var(--rule); color: var(--brass); }

  @media (max-width: 380px) {
    .coin-stage { width: 148px; height: 148px; }
    .rosette { width: 260px; height: 260px; }
    .territory { padding-left: 12px; padding-right: 12px; }
    .territory--mine { padding-left: 0; }
    .territory--theirs { padding-right: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .coin, .coin.spinning, .rosette { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="panel">

    <div class="eyebrow">Alea iacta est</div>
    <h1>Call It</h1>
    <div class="rule"><i></i></div>
    <div class="status" id="status">Starting up</div>

    <div class="invite-box" id="inviteBox" hidden>
      <p>Send this to your opponent</p>
      <div class="invite-row">
        <input id="inviteLink" type="text" readonly aria-label="Invite link">
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
    </div>

    <div class="field">
      <div class="table">
        <section class="territory territory--mine" id="territoryMine">
          <div class="territory__role" id="localRoleLabel">You</div>
          <input id="localNameInput" type="text" placeholder="Your name" maxlength="20" autocomplete="off" aria-label="Your name">
          <div id="localSideArea"></div>
        </section>
        <section class="territory territory--theirs" id="territoryTheirs">
          <div class="territory__role">Opponent</div>
          <div class="opponent-name is-empty" id="remoteNameDisplay">Waiting to join</div>
          <div class="side-readout" id="remoteSideDisplay"></div>
        </section>
      </div>

      <div class="history-row" id="historyRow"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const roomId = params.get('room');
  const isHost = !roomId;

  const statusEl = document.getElementById('status');
  const inviteBox = document.getElementById('inviteBox');
  const inviteLink = document.getElementById('inviteLink');
  const copyBtn = document.getElementById('copyBtn');
  const localRoleLabel = document.getElementById('localRoleLabel');
  const localNameInput = document.getElementById('localNameInput');
  const localSideArea = document.getElementById('localSideArea');
  const remoteNameDisplay = document.getElementById('remoteNameDisplay');
  const remoteSideDisplay = document.getElementById('remoteSideDisplay');
  const territoryMine = document.getElementById('territoryMine');
  const territoryTheirs = document.getElementById('territoryTheirs');
  const coin = document.getElementById('coin');
  const resultEl = document.getElementById('result');
  const flipBtn = document.getElementById('flipBtn');
  const scoreEl = document.getElementById('score');
  const historyRow = document.getElementById('historyRow');
  const ledger = document.getElementById('ledger');

  let peer, conn, connected = false;
  let localName = '';
  let remoteName = '';
  // 'heads' | 'tails' — always the HOST's side. Drawn at random by the host,
  // then either player may toggle it until the first flip locks it in.
  let calledSide = isHost ? randomSide() : null;
  let sidesLocked = false;
  let flipping = false;
  let myScore = 0, theirScore = 0;
  const history = [];

  localRoleLabel.textContent = isHost ? 'You · host' : 'You';

  localSideArea.innerHTML =
    '<div class="side-buttons">' +
      '<button class="side-btn" id="callHeads" disabled>Heads</button>' +
      '<button class="side-btn" id="callTails" disabled>Tails</button>' +
    '</div>';

  const headsBtn = document.getElementById('callHeads');
  const tailsBtn = document.getElementById('callTails');

  function randomSide() { return Math.random() < 0.5 ? 'heads' : 'tails'; }
  function oppositeSide(side) { return side === 'heads' ? 'tails' : 'heads'; }
  function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

  function mySide() {
    if (!calledSide) return null;
    return isHost ? calledSide : oppositeSide(calledSide);
  }
  function theirSide() {
    if (!calledSide) return null;
    return isHost ? oppositeSide(calledSide) : calledSide;
  }

  function renderSideUI() {
    const canSwap = connected && !!calledSide && !sidesLocked && !flipping;
    headsBtn.disabled = !canSwap;
    tailsBtn.disabled = !canSwap;
    headsBtn.classList.toggle('chosen', mySide() === 'heads');
    tailsBtn.classList.toggle('chosen', mySide() === 'tails');
    remoteSideDisplay.textContent = (connected && calledSide) ? theirSide() : '';
    inscribeCoin();
    previewSide();
  }

  // Until the first flip locks things in, the coin shows the face you hold —
  // switching sides turns it over the same way typing re-cuts the inscription.
  function previewSide() {
    if (flipping || sidesLocked || !calledSide) return;
    coin.classList.add('previewing');
    coin.style.transform = mySide() === 'heads' ? 'rotateY(0deg)' : 'rotateY(180deg)';
  }

  function renderNames() {
    remoteNameDisplay.textContent = remoteName || 'Waiting to join';
    remoteNameDisplay.classList.toggle('is-empty', !remoteName);
    inscribeCoin();
  }

  // The rim legend is struck with whoever holds that face. An unclaimed face
  // reads IGNOTVS — unknown.
  const ARC_LIMIT = 150;   // user units available along the upper rim arc

  function inscribe(tag, name) {
    const main = document.getElementById('name' + tag);
    const light = document.getElementById('name' + tag + 'Light');
    const text = (name || 'Ignotvs').toUpperCase();
    main.firstElementChild.textContent = text;
    light.firstElementChild.textContent = text;

    let size = 18, tracking = 4.4;
    for (let i = 0; i < 16; i++) {
      main.setAttribute('font-size', size);
      main.setAttribute('letter-spacing', tracking);
      let len = 0;
      try { len = main.getComputedTextLength(); } catch (e) { len = 0; }
      if (!len || len <= ARC_LIMIT) break;
      size -= 0.9;
      tracking = Math.max(0.5, tracking - 0.34);
    }
    light.setAttribute('font-size', main.getAttribute('font-size'));
    light.setAttribute('letter-spacing', main.getAttribute('letter-spacing'));
  }

  function inscribeCoin() {
    const side = mySide();
    inscribe('A', side ? (side === 'heads' ? localName : remoteName) : '');
    inscribe('B', side ? (side === 'tails' ? localName : remoteName) : '');
  }

  function updateStatus() {
    if (!connected) {
      statusEl.textContent = isHost ? 'Waiting for opponent' : 'Connecting';
    } else {
      statusEl.textContent = 'Connected';
    }
    document.body.classList.toggle('is-live', connected);
  }

  function checkReady() {
    const ready = connected && localName && remoteName && calledSide && !flipping;
    flipBtn.disabled = !ready;
    if (!history.length) {
      resultEl.classList.add('muted');
      resultEl.textContent = ready
        ? 'Sides are set — flip when you are'
        : 'Sides are drawn at random — enter names to begin';
    }
  }

  function send(msg) { if (conn && conn.open) conn.send(msg); }

  function setupConn() {
    conn.on('open', function () {
      connected = true;
      send({ type: 'hello', name: localName });
      if (isHost) send({ type: 'call', side: calledSide });
      updateStatus();
      renderSideUI();
      checkReady();
    });
    conn.on('data', handleData);
    conn.on('close', function () {
      connected = false;
      statusEl.textContent = 'Opponent disconnected';
      document.body.classList.remove('is-live');
      flipBtn.disabled = true;
      renderSideUI();
    });
  }

  function handleData(msg) {
    if (msg.type === 'hello') {
      remoteName = msg.name;
      renderNames();
      checkReady();
    } else if (msg.type === 'call') {
      calledSide = msg.side;
      renderSideUI();
      checkReady();
    } else if (msg.type === 'flip') {
      doFlip(msg.result);
    }
  }

  function doFlip(result) {
    flipping = true;
    sidesLocked = true;
    flipBtn.disabled = true;
    renderSideUI();

    territoryMine.classList.remove('is-winner');
    territoryTheirs.classList.remove('is-winner');
    resultEl.classList.add('muted');
    resultEl.textContent = 'In the air';

    document.body.classList.add('is-flipping');
    coin.classList.remove('previewing');
    coin.classList.remove('spinning');
    void coin.offsetWidth;
    coin.classList.add('spinning');

    setTimeout(function () {
      document.body.classList.remove('is-flipping');
      coin.style.transform = result === 'heads' ? 'rotateY(0deg)' : 'rotateY(180deg)';

      const winnerIsMe = result === mySide();
      const winnerName = winnerIsMe ? (localName || 'You') : (remoteName || 'Opponent');
      resultEl.classList.remove('muted');
      resultEl.innerHTML = capitalize(result) + ' — <span>' + winnerName + '</span> takes it';
      (winnerIsMe ? territoryMine : territoryTheirs).classList.add('is-winner');

      if (winnerIsMe) myScore++; else theirScore++;
      scoreEl.innerHTML = (localName || 'You') + ' <strong>' + myScore + '</strong>' +
                          ' &nbsp;·&nbsp; ' +
                          (remoteName || 'Opponent') + ' <strong>' + theirScore + '</strong>';

      ledger.hidden = false;
      history.push(result);
      if (history.length > 10) history.shift();
      historyRow.innerHTML = '';
      history.slice().reverse().forEach(function (r) {
        const chip = document.createElement('div');
        chip.className = 'chip' + (r === 'tails' ? ' chip--tails' : '');
        chip.textContent = r === 'heads' ? 'H' : 'T';
        chip.title = capitalize(r);
        historyRow.appendChild(chip);
      });

      flipping = false;
      checkReady();
    }, 1100);
  }

  function chooseSide(side) {
    if (sidesLocked || flipping || !connected || side === mySide()) return;
    calledSide = isHost ? side : oppositeSide(side);
    send({ type: 'call', side: calledSide });
    renderSideUI();
    checkReady();
  }

  headsBtn.addEventListener('click', function () { chooseSide('heads'); });
  tailsBtn.addEventListener('click', function () { chooseSide('tails'); });

  flipBtn.addEventListener('click', function () {
    if (flipping || flipBtn.disabled) return;
    const result = randomSide();
    send({ type: 'flip', result: result });
    doFlip(result);
  });

  localNameInput.addEventListener('input', function () {
    localName = localNameInput.value.trim();
    send({ type: 'hello', name: localName });
    inscribeCoin();
    checkReady();
  });

  copyBtn.addEventListener('click', function () {
    inviteLink.select();
    navigator.clipboard && navigator.clipboard.writeText(inviteLink.value).catch(function () {});
    copyBtn.textContent = 'Copied';
    setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
  });

  // --- PeerJS connection setup ---
  peer = new Peer();

  peer.on('open', function (id) {
    if (isHost) {
      inviteLink.value = location.origin + location.pathname + '?room=' + id;
      inviteBox.hidden = false;
      updateStatus();
    } else {
      conn = peer.connect(roomId);
      setupConn();
      updateStatus();
    }
  });

  if (isHost) {
    peer.on('connection', function (c) {
      conn = c;
      setupConn();
    });
  }

  peer.on('error', function () {
    statusEl.textContent = 'Connection error — reload to retry';
    document.body.classList.remove('is-live');
  });

  renderNames();
  renderSideUI();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(inscribeCoin);
  }
})();
</script>
